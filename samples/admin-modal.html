<div id="sample-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="sample-editor-title"><div class="dialog"><div class="dialog-head"><h2 id="sample-editor-title">Add sample</h2><button class="close" aria-label="Close sample editor">×</button></div><form id="sample-form"><input type="hidden" name="id"><label>Sample title<input name="title" required maxlength="160" placeholder="A brand film, a website concept…"></label><label>Media type<select name="type" id="sample-type"><option value="picture">Picture</option><option value="video">Video</option></select></label><label class="sample-upload-label">Upload picture or video (20 MB max)<input type="file" id="sample-file" accept="image/jpeg,image/png,image/webp,video/mp4,video/webm"><span class="media-hint">JPG, PNG, WebP, MP4 or WebM. Select a file, wait for the upload, then publish.</span></label><label>Media URL<input name="url" required placeholder="Upload above or paste a direct HTTPS media URL"></label><div id="video-options" hidden><label>Video poster image URL (optional)<input name="poster" placeholder="https://…"></label><label style="margin-top:14px">Upload poster image<input type="file" id="sample-poster-file" accept="image/jpeg,image/png,image/webp"></label><p class="media-hint">Use a direct MP4/WebM URL, not a YouTube page link. Larger videos can be hosted elsewhere and linked here.</p></div><label>Caption<textarea name="caption" maxlength="1200" placeholder="A short description of the sample."></textarea></label><div id="sample-media-preview" class="sample-preview"></div><div class="form-actions"><button class="btn" id="publish-sample" type="submit">Publish sample</button><button class="btn danger hidden" id="delete-sample" type="button">Delete sample</button></div><p id="sample-error" class="sample-error" role="status"></p></form></div></div>
